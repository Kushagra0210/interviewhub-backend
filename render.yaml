# Free-tier deployment preparation. Secrets and public URLs are supplied in Render.
# No database, paid service, or background worker is provisioned by this blueprint.
services:
  - type: web
    name: interviewhub-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
  - type: web
    name: interviewhub-ai
    runtime: python
    rootDir: apps/ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: ollama-cloud
      - key: LLM_BASE_URL
        value: https://ollama.com
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.0
