services:
  mongo:
    image: mongo:8.0
    volumes: [mongo-data:/data/db]
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping')"]
      interval: 10s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.17.0
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
  ai:
    build: ./apps/ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:0.6b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-questions_nomic_v1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8000:8000"]
  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/interviewhub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      AI_SERVICE_URL: http://ai:8000
      WEB_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      mongo: {condition: service_healthy}
      ai: {condition: service_healthy}
  indexer:
    build: .
    command: [sh, -c, "while true; do node scripts/reindex.js; sleep 30; done"]
    environment:
      MONGO_URI: mongodb://mongo:27017/interviewhub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      api: {condition: service_healthy}
  web:
    build: ./apps/web
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  mongo-data:
  qdrant-data:
